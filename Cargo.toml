[workspace]
resolver = "2"
members = ["crates/gen", "crates/render", "crates/capture", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
wgpu = "30.0.2"
winit = "0.30"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false }
mega_gen = { path = "crates/gen" }
mega_render = { path = "crates/render" }
parry3d = "0.31"

[profile.dev]
opt-level = 1
